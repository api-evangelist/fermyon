source: >-
  npm registry.npmjs.org, crates.io, pypi.org, proxy.golang.org, api.nuget.org and
  the Fermyon / Spin Framework GitHub organizations, reached 2026-09-09.
provider: Fermyon
providerId: fermyon
description: >-
  First-party client libraries and plugins for the Fermyon surface. Two distinct
  families live here. (1) The Fermyon Cloud control plane (cloud.fermyon.com), whose
  only published client is the generated Rust client in fermyon/cloud-openapi plus
  the `spin cloud` CLI plugin. (2) The Spin application SDKs — the libraries you write
  a Spin/Wasm function with. Those SDKs were donated to the CNCF and now live under the
  spinframework GitHub org, so their SOURCE has moved even though several are still
  published under the @fermyon npm scope and the fermyon-authored crates.
note: >-
  Currency is the finding here. The Spin SDKs that migrated to the spinframework org
  are current (Rust 7.0.0 Aug 2026, Python 4.0.0 Apr 2026). The packages still carried
  under the Fermyon name are not: @fermyon/spin-sdk last published 2025-02-24, the
  Fermyon Cloud `spin cloud` plugin last released 2025-03-25, and the cloud-openapi
  repo that generates the Cloud REST client was last pushed 2024-05-10 — older than the
  Cloud API it wraps. Fermyon.Spin.Sdk on NuGet has not moved since 2022 and is alpha.
