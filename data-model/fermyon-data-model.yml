  - name: DeviceCode
    schema: DeviceCodeItem
    operations:
      - 'POST /api/device-codes'
      - 'GET /api/device-codes/{userCode}'
      - 'POST /api/device-codes/activate'
    fields: [deviceCode, userCode, verificationUrl, expiresIn, interval]
  - name: LogEntry
    schema: Entry
    operations:
      - 'GET /api/apps/{id}/logs'
      - 'GET /api/apps/{id}/logs/raw'
      - 'GET /api/channels/{id}/logs'
      - 'GET /api/channels/{id}/logs/raw'
    fields: [meta, logLines]
  - name: AppEvent
    schema: AppEventItem
    operations:
      - 'GET /api/apps/{id}/events'
    fields: [date, type, name, metadata]
    note: type is the AppEventType enum — Unknown, Create, Update, Delete.
  - name: AppRequestCount
    schema: AppRequestCountItem
    operations:
      - 'GET /api/apps/{id}/request-count'
