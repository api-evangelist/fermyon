notes:
  - >-
    Cascade behaviour is documented in prose, not in the contract: deleting an App also
    destroys its default key-value store and every application variable, permanently
    (https://developer.fermyon.com/cloud/delete). The OpenAPI gives no hint of this.
  - >-
    There is no user or team entity in the Fermyon Cloud contract. Identity is an Account
    plus a token; there is no membership, role or permission object anywhere.
