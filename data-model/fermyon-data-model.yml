source: >-
  openapi/_original/fermyon-openapi.yml — $ref edges and id-reference fields across the
  73 component schemas, harvested from
  https://raw.githubusercontent.com/fermyon/cloud-openapi/main/swagger.json.
provider: Fermyon
providerId: fermyon
api: Fermyon Cloud REST API
description: >-
  The entity graph the Fermyon Cloud API actually models. The spine is
  Account -> App -> Channel -> Revision: an App is the unit you own, a Revision is an
  immutable build pushed to the OCI registry, and a Channel is the named, addressable
  deployment that selects WHICH revision is live. Stateful resources (key-value stores,
  SQL databases, variable pairs) are separate entities attached to Apps through a
  ResourceLabel link rather than owned by them, which is why they survive independently
  and are shareable across applications.
identifiers:
  primary_format: uuid
  note: >-
    id, appId, channelId and activeRevisionId are all `string` with `format: uuid`. There
    are no typed/prefixed identifiers (no `app_...` style prefix) anywhere in the contract,
    so an identifier carries no clue about which resource it addresses. Two non-uuid
    identifiers exist and are meaningful: storageId on App/Revision (the OCI storage
    reference) and revisionNumber on RevisionItem (a human-readable build number).
entities:
  - name: Account
    schema: AccountDetails
    operations:
      - 'GET /api/accounts/{id}'
      - 'PATCH /api/accounts/{id}'
      - 'DELETE /api/accounts/{id}'
    fields: [plan, isMarketingEmailOn, createdAt]
  - name: AccountPlan
    schema: AccountPlanRecord
    fields: [accountType, cancelAt, cycleStartDate, cycleEndDate, lastModified]
    note: Subscription state. accountType is the AccountPlanType enum; see plans/.
  - name: App
    schema: AppItem
    operations:
      - 'GET /api/apps'
      - 'POST /api/apps'
      - 'GET /api/apps/{id}'
      - 'PUT /api/apps/{id}'
      - 'PATCH /api/apps/{id}'
      - 'DELETE /api/apps/{id}'
    fields: [id, name, storageId, description, subdomain, healthStatus, channels, domain, lastModified, lastDeployed]
  - name: Channel
    schema: ChannelItem
    operations:
      - 'GET /api/channels'
      - 'POST /api/channels'
      - 'GET /api/channels/{id}'
      - 'PUT /api/channels/{id}'
      - 'PATCH /api/channels/{id}'
      - 'DELETE /api/channels/{id}'
      - 'PUT /api/channels/{channelId}/desired-status'
    fields: [id, appId, name, domain, revisionSelectionStrategy, desiredStatus, activeRevision, environmentVariables, rangeRule, lastPublishAt, lastModified]
  - name: Revision
    schema: RevisionItem
    operations: [GET /api/revisions, POST /api/revisions]
    fields: [id, appId, revisionNumber, components, lastModified]
  - name: AppDomain
    schema: AppDomainItem
    operations:
      - 'GET /api/custom-domains/{domainName}'
    fields: [validationStatus]
  - name: KeyValueStore
    schema: KeyValueStoreItem
    operations:
      - 'GET /api/key-value-stores'
      - 'POST /api/key-value-stores/{store}'
      - 'DELETE /api/key-value-stores/{store}'
      - 'PATCH /api/key-value-stores/{store}/rename'
      - 'POST /api/key-value-stores/{store}/links'
      - 'DELETE /api/key-value-stores/{store}/links'
    fields: [name, links]
  - name: KeyValuePair
    schema: CreateKeyValuePairCommand
    operations: [POST /api/key-value-pairs]
    fields: [appId, key, value]
  - name: SqlDatabase
    schema: Database
    operations:
      - 'GET /api/sql-databases'
      - 'POST /api/sql-databases/create'
      - 'DELETE /api/sql-databases'
      - 'POST /api/sql-databases/execute'
      - 'PATCH /api/sql-databases/{database}/rename'
      - 'POST /api/sql-databases/{database}/links'
      - 'DELETE /api/sql-databases/{database}/links'
    fields: [name, default, links]
  - name: VariablePair
    schema: CreateVariablePairCommand
    operations: [GET /api/variable-pairs, POST /api/variable-pairs, DELETE /api/variable-pairs]
    fields: [appId, variable, value]
  - name: ResourceLabel
    schema: ResourceLabel
    fields: [label, appId, appName]
    note: >-
      The join entity. A KeyValueStore or SqlDatabase carries a links[] of ResourceLabels,
      each naming the App that consumes it under a local label — which is how one store is
      shared by several applications.
  - name: PersonalAccessToken
    schema: PersonalAccessTokenItem
    operations:
      - 'GET /api/personal-access-tokens'
      - 'POST /api/personal-access-tokens'
      - 'DELETE /api/personal-access-tokens/{id}'
