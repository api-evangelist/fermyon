openapi: 3.2.0
info:
  title: Fermyon Cloud Auth Tokens API
  version: '1.0'
security:
- Bearer: []
tags:
- name: Auth Tokens
paths:
  /api/auth-tokens:
    post:
      tags:
      - Auth Tokens
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateTokenCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateTokenCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateTokenCommand'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TokenInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
      summary: Create api auth tokens
      x-summary-source: derived
      operationId: postApiAuthTokens
      x-operation-id-source: derived
  /api/auth-tokens/refresh:
    post:
      tags:
      - Auth Tokens
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/RefreshTokenCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RefreshTokenCommand'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TokenInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
      summary: Create api auth tokens refresh
      x-summary-source: derived
      operationId: postApiAuthTokensRefresh
      x-operation-id-source: derived
components:
  schemas:
    TokenInfo:
      required:
      - expiration
      - refreshToken
      - token
      type: object
      properties:
        token:
          minLength: 1
          type: string
        refreshToken:
          minLength: 1
          type: string
        expiration:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    RefreshTokenCommand:
      required:
      - refreshToken
      - token
      type: object
      properties:
        token:
          minLength: 1
          type: string
        refreshToken:
          minLength: 1
          type: string
      additionalProperties: false
    AccountProvider:
      enum:
      - GitHub
      - DeviceFlow
      type: string
    CreateTokenCommand:
      type: object
      properties:
        providerCode:
          type: string
        clientId:
          type: string
        provider:
          $ref: '#/components/schemas/AccountProvider'
        isMarketingEmailOn:
          type: boolean
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
      name: Authorization
      in: header
