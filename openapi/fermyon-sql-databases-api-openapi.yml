openapi: 3.2.0
info:
  title: Fermyon Cloud Sql Databases API
  version: '1.0'
security:
- Bearer: []
tags:
- name: Sql Databases
paths:
  /api/sql-databases/create:
    post:
      tags:
      - Sql Databases
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateSqlDatabaseCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSqlDatabaseCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateSqlDatabaseCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateSqlDatabaseCommand'
        required: true
      responses:
        '200':
          description: Success
      summary: Create api sql databases create
      x-summary-source: derived
      operationId: postApiSqlDatabasesCreate
      x-operation-id-source: derived
  /api/sql-databases/execute:
    post:
      tags:
      - Sql Databases
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ExecuteSqlStatementCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSqlStatementCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/ExecuteSqlStatementCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ExecuteSqlStatementCommand'
        required: true
      responses:
        '200':
          description: Success
      summary: Create api sql databases execute
      x-summary-source: derived
      operationId: postApiSqlDatabasesExecute
      x-operation-id-source: derived
  /api/sql-databases:
    delete:
      tags:
      - Sql Databases
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DeleteSqlDatabaseCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSqlDatabaseCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteSqlDatabaseCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteSqlDatabaseCommand'
        required: true
      responses:
        '200':
          description: Success
      summary: Delete api sql databases
      x-summary-source: derived
      operationId: deleteApiSqlDatabases
      x-operation-id-source: derived
    get:
      tags:
      - Sql Databases
      parameters:
      - name: appId
        in: query
        schema:
          type: string
          format: uuid
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/GetSqlDatabasesQuery'
          application/json:
            schema:
              $ref: '#/components/schemas/GetSqlDatabasesQuery'
          text/json:
            schema:
              $ref: '#/components/schemas/GetSqlDatabasesQuery'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GetSqlDatabasesQuery'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DatabasesList'
            application/json:
              schema:
                $ref: '#/components/schemas/DatabasesList'
            text/json:
              schema:
                $ref: '#/components/schemas/DatabasesList'
      summary: Get api sql databases
      x-summary-source: derived
      operationId: getApiSqlDatabases
      x-operation-id-source: derived
  /api/sql-databases/{database}/links:
    post:
      tags:
      - Sql Databases
      parameters:
      - name: database
        in: path
        required: true
        schema:
          type: string
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
          text/json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
        required: true
      responses:
        '200':
          description: Success
      summary: Create api sql databases by database links
      x-summary-source: derived
      operationId: postApiSqlDatabasesByDatabaseLinks
      x-operation-id-source: derived
    delete:
      tags:
      - Sql Databases
      parameters:
      - name: database
        in: path
        required: true
        schema:
          type: string
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
          text/json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ResourceLabel'
        required: true
      responses:
        '200':
          description: Success
      summary: Delete api sql databases by database links
      x-summary-source: derived
      operationId: deleteApiSqlDatabasesByDatabaseLinks
      x-operation-id-source: derived
  /api/sql-databases/{database}/rename:
    patch:
      tags:
      - Sql Databases
      parameters:
      - name: database
        in: path
        required: true
        schema:
          type: string
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
          application/*+json:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Success
      summary: Update api sql databases by database rename
      x-summary-source: derived
      operationId: patchApiSqlDatabasesByDatabaseRename
      x-operation-id-source: derived
components:
  schemas:
    ResourceLabel:
      required:
      - appId
      - label
      type: object
      properties:
        label:
          minLength: 1
          type: string
        appId:
          type: string
          format: uuid
        appName:
          type: string
      additionalProperties: false
    Database:
      required:
      - links
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
        default:
          type: boolean
        links:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLabel'
      additionalProperties: false
    GetSqlDatabasesQuery:
      type: object
      properties:
        appId:
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    ExecuteSqlStatementCommand:
      required:
      - database
      - default
      - statement
      type: object
      properties:
        database:
          minLength: 1
          type: string
        default:
          type: boolean
        statement:
          minLength: 1
          type: string
      additionalProperties: false
    CreateSqlDatabaseCommand:
      required:
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
        appId:
          type:
          - string
          - 'null'
          format: uuid
        label:
          type:
          - string
          - 'null'
      additionalProperties: false
    DatabasesList:
      required:
      - databases
      type: object
      properties:
        databases:
          type: array
          items:
            $ref: '#/components/schemas/Database'
      additionalProperties: false
    DeleteSqlDatabaseCommand:
      required:
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
      name: Authorization
      in: header
