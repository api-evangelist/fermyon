openapi: 3.2.0
info:
  title: Fermyon Cloud Key Value Pairs API
  version: '1.0'
security:
- Bearer: []
tags:
- name: Key-Value Pairs
paths:
  /api/key-value-pairs:
    post:
      tags:
      - Key-Value Pairs
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateKeyValuePairCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyValuePairCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateKeyValuePairCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateKeyValuePairCommand'
        required: true
      responses:
        '200':
          description: Success
      summary: Create api key value pairs
      x-summary-source: derived
      operationId: postApiKeyValuePairs
      x-operation-id-source: derived
components:
  schemas:
    CreateKeyValuePairCommand:
      required:
      - key
      - value
      type: object
      properties:
        appId:
          type: string
          format: uuid
        storeName:
          type: string
        key:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
        label:
          type: string
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
      name: Authorization
      in: header
