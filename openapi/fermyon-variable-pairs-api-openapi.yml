openapi: 3.2.0
info:
  title: Fermyon Cloud Variable Pairs API
  version: '1.0'
security:
- Bearer: []
tags:
- name: variable-pairs
paths:
  /api/variable-pairs:
    post:
      tags:
      - variable-pairs
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateVariablePairCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariablePairCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateVariablePairCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateVariablePairCommand'
        required: true
      responses:
        '200':
          description: Success
      summary: Create api variable pairs
      x-summary-source: derived
      operationId: postApiVariablePairs
      x-operation-id-source: derived
    delete:
      tags:
      - variable-pairs
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DeleteVariablePairCommand'
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteVariablePairCommand'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteVariablePairCommand'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteVariablePairCommand'
        required: true
      responses:
        '200':
          description: Success
      summary: Delete api variable pairs
      x-summary-source: derived
      operationId: deleteApiVariablePairs
      x-operation-id-source: derived
    get:
      tags:
      - variable-pairs
      parameters:
      - name: Api-Version
        in: header
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/GetVariablesQuery'
          application/json:
            schema:
              $ref: '#/components/schemas/GetVariablesQuery'
          text/json:
            schema:
              $ref: '#/components/schemas/GetVariablesQuery'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GetVariablesQuery'
        required: true
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/VariablesList'
            application/json:
              schema:
                $ref: '#/components/schemas/VariablesList'
            text/json:
              schema:
                $ref: '#/components/schemas/VariablesList'
      summary: Get api variable pairs
      x-summary-source: derived
      operationId: getApiVariablePairs
      x-operation-id-source: derived
components:
  schemas:
    VariablesList:
      required:
      - vars
      type: object
      properties:
        vars:
          type: array
          items:
            type: string
      additionalProperties: false
    DeleteVariablePairCommand:
      required:
      - appId
      - variable
      type: object
      properties:
        appId:
          type: string
          format: uuid
        variable:
          minLength: 1
          type: string
      additionalProperties: false
    GetVariablesQuery:
      required:
      - appId
      type: object
      properties:
        appId:
          type: string
          format: uuid
      additionalProperties: false
    CreateVariablePairCommand:
      required:
      - appId
      - value
      - variable
      type: object
      properties:
        appId:
          type: string
          format: uuid
        variable:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
      name: Authorization
      in: header
